name: Build PC app (S2mini60)

on:
  push:
    paths: ["pc-app/**", ".github/workflows/pc-app.yml"]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: pc-app
        shell: cmd
        # --onedir (a folder with the exe) instead of --onefile: the self-extracting single file
        # is often flagged by antivirus heuristics (e.g. Defender "Sabsik ... !ml").
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onedir --windowed --noupx --name S2mini60 --collect-all customtkinter --collect-all winrt --collect-submodules pycaw --collect-submodules comtypes --hidden-import pystray._win32 --hidden-import hid --hidden-import serial --hidden-import serial.tools.list_ports s2mini_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: S2mini60
          path: pc-app/dist/S2mini60/
