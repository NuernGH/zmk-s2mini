CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_NEXT=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_HID_INDICATORS=y

# Enkoder EC11
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Ekran SH1106 (wbudowany ekran stanu ZMK)
CONFIG_ZMK_DISPLAY=y

# UART0 jest wyłączony (IO16/IO17 to klawisze), więc bez konsoli szeregowej
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
