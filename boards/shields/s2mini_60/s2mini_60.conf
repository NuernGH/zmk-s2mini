CONFIG_ZMK_KEYBOARD_NAME="S2 mini 60"
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_NEXT=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_HID_INDICATORS=y

# EC11 encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# SH1106 screen: custom status screen (layer, knob mode, GAME, PC data), texts in English
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_S2MINI_STATUS_SCREEN=y
# LVGL memory: the default 2 KB (with a custom screen) is not even enough to start LVGL
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# The screen is monochrome: without this LVGL draws 16-bit into a 1-bit buffer and crashes
CONFIG_LV_COLOR_DEPTH_1=y
# Draw buffer for the whole screen (1 KB). The default 10% is ~6 rows, but the SH1106 needs 8-row
# pages: LVGL looped forever without sending anything to the screen (only lines on the screen).
CONFIG_LV_Z_VDB_SIZE=100
# Screen on its own low-priority work queue. On the system work queue (cooperative thread) screen
# refreshes starved the USB driver thread (DWC2, priority 8) and USB did not enumerate.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=12
# LVGL drawing (labels, fonts) does not fit in the default 3 KB stack: the overflow corrupted
# the heap and thread lists, and the board crashed after a few seconds of typing / turning the knob.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# Data from the PC over Raw HID (PC app in pc-app/)
CONFIG_S2MINI_RAW_HID=y

# SCROLL knob mode (mouse wheel)
CONFIG_ZMK_POINTING=y

# ZMK Studio over USB serial (CDC ACM); unlock: Fn + \
CONFIG_ZMK_STUDIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Keymap changes from Studio are saved in the "storage" partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# The console stays on UART0, moved to the unconnected GPIO43/44 (see overlay):
# without it the ESP32-S2 does not boot.

# Time for the row lines to discharge between columns. Without it the weak ESP32-S2 internal
# pull-down (~45 kΩ) could not discharge a row in time and a key "leaked" into the next column
# (' also sent Enter, left Shift+Z sent ZXCV).
CONFIG_ZMK_INPUT_MATRIX_WAIT_BEFORE_INPUTS=5
CONFIG_ZMK_INPUT_MATRIX_WAIT_BETWEEN_OUTPUTS=30

# Images (quick launch icons)
CONFIG_LV_USE_IMAGE=y
