CONFIG_ZMK_KEYBOARD_NAME="S2 mini 60"
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_NEXT=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_HID_INDICATORS=y

# Enkoder EC11
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Ekran SH1106: własny ekran (warstwa, tryb gałki, GAME, dane z PC), teksty po angielsku
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_S2MINI_STATUS_SCREEN=y
# Pamięć LVGL: domyślne 2 KB (przy własnym ekranie) nie wystarczają nawet na start LVGL
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# Ekran jest monochromatyczny: bez tego LVGL rysuje w 16 bitach do bufora na 1 bit i się wywala
CONFIG_LV_COLOR_DEPTH_1=y
# Bufor rysowania na cały ekran (1 KB). Domyślne 10% to ~6 wierszy, a SH1106 wymaga pasów po 8
# wierszy: LVGL kręcił się w kółko, nie wysyłając niczego do ekranu (na ekranie same linie).
CONFIG_LV_Z_VDB_SIZE=100
# Ekran na własnej kolejce o niskim priorytecie. Na kolejce systemowej (wątek kooperacyjny)
# odświeżanie ekranu zagłodziło wątek sterownika USB (DWC2, priorytet 8) i USB się nie zgłaszało.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=12
# Rysowanie LVGL (etykiety, czcionki) nie mieści się w domyślnych 3 KB stosu: przepełnienie
# niszczyło stertę i listy wątków, a płytka padała po kilku sekundach pisania/kręcenia gałką.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# Dane z PC przez Raw HID (program pc-app/s2mini_oled.py)
CONFIG_S2MINI_RAW_HID=y

# Tryb gałki SCROLL (kółko myszy)
CONFIG_ZMK_POINTING=y

# ZMK Studio przez port szeregowy USB (CDC ACM); odblokowanie: Fn + \
CONFIG_ZMK_STUDIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Zapis zmian keymapy z Studio w partycji "storage"
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Konsola zostaje na UART0 przeniesionym na niewyprowadzone GPIO43/44 (patrz overlay):
# bez niej ESP32-S2 nie startuje.

# Czas na rozładowanie linii rzędów między kolumnami. Bez tego wewnętrzne podciąganie ESP32-S2
# (~45 kΩ) nie zdążało rozładować rzędu i klawisz „przeciekał” do następnej kolumny
# (' dawało też Enter, lewy Shift+Z dawał ZXCV).
CONFIG_ZMK_INPUT_MATRIX_WAIT_BEFORE_INPUTS=5
CONFIG_ZMK_INPUT_MATRIX_WAIT_BETWEEN_OUTPUTS=30

# Obrazki (ikony szybkiego startu)
CONFIG_LV_USE_IMAGE=y
