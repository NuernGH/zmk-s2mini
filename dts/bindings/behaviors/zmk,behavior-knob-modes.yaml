# SPDX-License-Identifier: MIT
description: |
  Knob with several modes. Each mode is a separate sensor behavior (e.g. sensor-rotate);
  &knob_next changes the active mode. Mode names are shown on the screen.

compatible: "zmk,behavior-knob-modes"

include: behavior-metadata.yaml

properties:
  "#sensor-binding-cells":
    type: int
    required: true
    const: 0
  modes:
    type: phandles
    required: true
    description: Sensor behaviors for the modes, in order.
  mode-names:
    type: string-array
    required: true
    description: Mode names shown on the screen (same count as modes).
